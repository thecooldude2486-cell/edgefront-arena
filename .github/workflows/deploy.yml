name: Deploy Edgefront Arena

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edgefront-arena-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build game
        run: npm run build

      - name: Verify deployable build
        run: |
          test -s dist/server/index.js
          test -s dist/server/wrangler.json
          test -d dist/client
          npx --no-install wrangler deploy --config dist/server/wrangler.json --dry-run

      - name: Check hosting connection
        id: hosting
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Build verified, but the game is NOT deployed. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in repository Actions secrets, then run this workflow again."
            echo "### Hosting connection needed" >> "$GITHUB_STEP_SUMMARY"
            echo "The game built successfully but is **not live yet**. Add the two secrets described in DEPLOYMENT.md, then select Run workflow again." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Deploy game to Cloudflare
        if: steps.hosting.outputs.ready == 'true'
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config dist/server/wrangler.json
          wranglerVersion: '4.92.0'

      - name: Show game link
        if: steps.hosting.outputs.ready == 'true'
        env:
          GAME_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          echo "### Game deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "$GAME_URL" >> "$GITHUB_STEP_SUMMARY"
